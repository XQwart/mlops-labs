name: lab6

services:
  db:
    image: postgres:16-alpine
    container_name: lab6_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: predictions_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d predictions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: lab6_api:latest
    container_name: lab6_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mlops:mlops_password@db:5432/predictions_db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
