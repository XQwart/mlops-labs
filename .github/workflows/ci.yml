name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fastapi-model-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-fastapi-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 06-fastapi-model-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
